<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DIBO Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="[telegram.org](https://telegram.org/js/telegram-web-app.js)"></script>
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <h1>DIBO Store</h1>
                    <p>Система учёта товаров</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login">Логин</label>
                        <input type="text" id="login" name="login" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Войти</button>
                    <p id="login-error" class="error-text"></p>
                </form>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="screen">
            <!-- Header -->
            <header id="app-header">
                <div class="header-left">
                    <button id="back-btn" class="btn-icon hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h2 id="page-title">Главное</h2>
                </div>
                <div class="header-right">
                    <span id="user-name" class="user-badge"></span>
                    <button id="theme-toggle" class="btn-icon">
                        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                        </svg>
                    </button>
                    <button id="logout-btn" class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <main id="content-area">
                <!-- Dynamic content loaded here -->
            </main>

            <!-- Bottom Navigation -->
            <nav id="bottom-nav">
                <button class="nav-item active" data-page="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9,22 9,12 15,12 15,22"/>
                    </svg>
                    <span>Главное</span>
                </button>
                <button class="nav-item" data-page="sales">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
                    </svg>
                    <span>Продажа</span>
                </button>
                <button class="nav-item" data-page="warehouse">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
                        <polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
                    </svg>
                    <span>Склад</span>
                </button>
                <button class="nav-item" data-page="receipt">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    <span>Оприход.</span>
                </button>
                <button class="nav-item" data-page="customers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                    <span>Покупатели</span>
                </button>
                <button class="nav-item" data-page="cash">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                        <line x1="1" y1="10" x2="23" y2="10"/>
                    </svg>
                    <span>Касса</span>
                </button>
                <button class="nav-item admin-only" data-page="reports">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    <span>Отчёты</span>
                </button>
            </nav>
        </div>

        <!-- Modals Container -->
        <div id="modals-container"></div>

        <!-- Toast Container -->
        <div id="toast-container"></div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="[gstatic.com](https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js)"></script>
    <script src="[gstatic.com](https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js)"></script>
    <script src="[gstatic.com](https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js)"></script>

    <!-- XLSX Library for Excel -->
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js)"></script>

    <!-- Chart.js -->
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js)"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/database.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/warehouse.js"></script>
    <script src="js/modules/sales.js"></script>
    <script src="js/modules/customers.js"></script>
    <script src="js/modules/suppliers.js"></script>
    <script src="js/modules/cash.js"></script>
    <script src="js/modules/reports.js"></script>
    <script src="js/modules/inventory.js"></script>
    <script src="js/modules/import.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
